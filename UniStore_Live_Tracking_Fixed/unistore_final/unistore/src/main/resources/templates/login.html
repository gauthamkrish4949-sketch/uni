<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1">

    <title>Sign in | UniStore</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>


<body class="login">

    <!-- DARK / LIGHT MODE BUTTON -->

    <button
        type="button"
        class="theme-toggle login-theme-toggle"
        id="themeToggle"
        onclick="toggleTheme()">

        <span
            class="theme-icon"
            id="themeIcon">
            🌙
        </span>

        <span id="themeText">
            Dark
        </span>

    </button>


    <div class="login-shell">

        <!-- BRAND -->

        <div class="login-brand">

            <span class="brand">
                Uni<span>Store</span>
            </span>

            <span class="campus">
                SBCE CAMPUS MARKETPLACE
            </span>

        </div>


        <!-- LOGIN BOX -->

        <div class="login-box">

            <div class="login-icon">
                🎓
            </div>


            <h1>
                Welcome back
            </h1>


            <p class="muted">
                Sign in to shop, print and track
                your campus orders.
            </p>


            <!-- ERROR MESSAGE -->

            <div
                th:if="${error}"
                class="error"
                th:text="${error}">
            </div>


            <!-- LOGIN FORM -->

            <form
                class="form"
                action="/login"
                method="post">

                <label>
                    Username
                </label>

                <input
                    name="username"
                    required
                    placeholder="Enter username">


                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    placeholder="Enter password">


                <button
                    class="btn full"
                    type="submit">

                    Sign in securely →

                </button>

            </form>


            <!-- DEMO ACCOUNTS -->

            <div class="demo">

                <b>
                    Demo accounts
                </b>

                <span>
                    Student:
                    <code>
                        student / student123
                    </code>
                </span>

                <span>
                    Admin:
                    <code>
                        admin / admin123
                    </code>
                </span>

            </div>

        </div>


        <p class="tiny center">
            UniStore is a Java Spring Boot academic project.
        </p>

    </div>


    <!-- DARK / LIGHT MODE SCRIPT -->

    <script>

        function applyTheme() {

            const darkMode =
                localStorage.getItem("unistore-theme") === "dark";


            document.body.classList.toggle(
                "dark-mode",
                darkMode
            );


            const icon =
                document.getElementById("themeIcon");

            const text =
                document.getElementById("themeText");


            if (icon && text) {

                if (darkMode) {

                    icon.textContent = "☀️";
                    text.textContent = "Light";

                } else {

                    icon.textContent = "🌙";
                    text.textContent = "Dark";

                }

            }

        }


        function toggleTheme() {

            const isDark =
                document.body.classList.contains("dark-mode");


            localStorage.setItem(
                "unistore-theme",
                isDark ? "light" : "dark"
            );


            applyTheme();

        }


        applyTheme();

    </script>


</body>

</html>
