<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${product.name} + ' | UniStore'">Product | UniStore</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/store">Uni<span>Store</span></a><nav class="nav"><a href="/store">Store</a><a href="/orders">My Orders</a><a href="/cart" class="cart-pill">🛒 Cart</a></nav></header><main class="container"><a class="back" href="/store">← Back to products</a><section class="detail-card"><div class="detail-image" th:text="${product.imageFile}">📦</div><div class="detail-content"><span class="category" th:text="${product.category}">Category</span><h1 th:text="${product.name}">Product</h1><div class="rating">★ 4.5 <span>• Campus favourite</span></div><p class="detail-desc" th:text="${product.description}">Description</p><div class="detail-price">₹<span th:text="${#numbers.formatDecimal(product.price,1,2)}">0.00</span></div><div class="availability" th:classappend="${product.stock>0?'available':'unavailable'}" th:text="${product.stock>0?'✓ In stock — '+product.stock+' available':'✕ Currently unavailable'}">Availability</div><form th:if="${product.stock>0}" class="buy-form" th:action="@{/add_to_cart/{id}(id=${product.id})}" method="post"><label>Quantity</label><input type="number" name="quantity" min="1" th:max="${product.stock}" value="1"><button class="btn" type="submit">🛒 Add to Cart</button></form><div class="trust"><span>✓</span> Campus pickup &nbsp; <span>✓</span> Order tracking &nbsp; <span>✓</span> Student-friendly prices</div></div></section></main></body></html>
