<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | UniStore</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/store">Uni<span>Store</span></a><nav class="nav"><a href="/store">Store</a><a href="/print">Print</a><a href="/logout">Logout</a></nav></header><main class="container"><span class="eyebrow dark">ORDER HISTORY</span><h1>My Orders</h1><div th:if="${orders.isEmpty()}" class="empty"><div>📦</div><h2>No orders yet</h2><a class="btn" href="/store">Shop now</a></div><div class="order-list" th:unless="${orders.isEmpty()}"><article class="order-card" th:each="o:${orders}"><div class="order-top"><div><b>Order #<span th:text="${o.id}">1</span></b><span class="muted" th:text="' • ' + o.orderType"> • STATIONERY</span></div><span class="status" th:text="${o.status}">PLACED</span></div><p th:text="${o.details}">Details</p><div class="order-bottom"><b>₹<span th:text="${#numbers.formatDecimal(o.totalAmount,1,2)}">0</span></b><a class="btn" th:href="@{/orders/{id}(id=${o.id})}">Track order →</a></div></article></div></main></body></html>
